name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then SDK="$d"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK not found"; exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SM" ]; then
            echo "sdkmanager not found"; exit 1
          fi
          echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"
          "$SM" --version

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarControl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk "CarControl-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CarControl-*.apk
          body: |
            CarControl 2.0 原生 Android 蓝牙小车遥控 App。

            - 原生 Kotlin + Material 3 界面
            - BLE 扫描、连接、遥控、特技动作与调速
            - 自动重连、运行日志、速度预设

            安装：下载 Release 附件中的 `CarControl-*.apk`。该安装包使用 debug 签名，若手机已安装旧版需先卸载。
